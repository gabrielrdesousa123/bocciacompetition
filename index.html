<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCBP - Boccia Competition System - Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; }
  a { color: inherit; }
  header { background: #0b1220; border-bottom: 1px solid #1e293b; padding: 14px 22px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  header .brand { display:flex; align-items:center; gap:10px; }
  header h1 { font-size: 17px; color: #fff; }
  header .role { font-size:11px; color:#93c5fd; background:#1e3a8a; padding:3px 9px; border-radius:999px; font-weight:700; }
  header .badge { font-size: 11px; background: #1e293b; color: #94a3b8; padding: 4px 10px; border-radius: 999px; }
  .lang { display:flex; gap:4px; }
  .lang button { background:#1e293b; color:#cbd5e1; border:none; padding:5px 10px; border-radius:6px; font-size:11px; font-weight:700; cursor:pointer; }
  .lang button.active { background:#2563eb; color:#fff; }
  .aviso { background: #7c2d12; color: #fed7aa; font-size: 12px; padding: 8px 22px; text-align: center; }

  .shell { display:flex; min-height: calc(100vh - 120px); }
  aside { width: 210px; background:#0b1220; border-right:1px solid #1e293b; padding:14px 10px; flex-shrink:0; }
  aside .side-title { font-size:10px; letter-spacing:1px; text-transform:uppercase; color:#475569; padding:6px 10px; }
  aside button { display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:transparent; color:#cbd5e1; border:none; padding:9px 10px; border-radius:8px; font-weight:600; font-size:13px; cursor:pointer; }
  aside button:hover { background:#111a2e; }
  aside button.active { background:#2563eb; color:#fff; }
  main { flex:1; max-width:1000px; margin:0 auto; padding: 22px 18px; width:100%; }

  .crumb { font-size:12px; color:#64748b; margin-bottom:14px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .crumb b { color:#cbd5e1; }
  .crumb .lnk { color:#60a5fa; cursor:pointer; }
  h2.page { font-size:20px; color:#fff; margin-bottom:4px; }
  p.sub { color:#94a3b8; font-size:13px; margin-bottom:18px; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px; }
  .tile { background:#111a2e; border:1px solid #1e293b; border-radius:12px; padding:16px; cursor:pointer; transition:.15s; }
  .tile:hover { border-color:#2563eb; transform:translateY(-2px); }
  .tile .k { font-size:26px; font-weight:900; color:#fff; }
  .tile .l { font-size:13px; color:#94a3b8; margin-top:4px; }
  .tile .go { font-size:11px; color:#60a5fa; margin-top:10px; font-weight:700; }

  .panel { background:#111a2e; border:1px solid #1e293b; border-radius:12px; padding:16px; margin-bottom:16px; }
  .panel h3 { font-size:14px; color:#fff; margin-bottom:12px; text-transform:uppercase; letter-spacing:.5px; }
  .kv { display:flex; flex-wrap:wrap; gap:10px 26px; }
  .kv div { font-size:13px; } .kv .lbl { color:#64748b; font-size:11px; text-transform:uppercase; }
  .kv .val { color:#e2e8f0; font-weight:700; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { background:#1e293b; color:#cbd5e1; padding:6px 12px; border-radius:999px; font-size:12px; font-weight:700; cursor:pointer; }
  .chip.active { background:#2563eb; color:#fff; }
  .btn { background:#2563eb; color:#fff; border:none; padding:9px 16px; border-radius:8px; font-weight:700; font-size:13px; cursor:pointer; }
  .btn.ghost { background:#1e293b; color:#cbd5e1; }
  .btnrow { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }

  table.data { width:100%; border-collapse:collapse; font-size:13px; }
  table.data th { text-align:left; color:#64748b; font-size:11px; text-transform:uppercase; border-bottom:1px solid #1e293b; padding:8px 10px; }
  table.data td { border-bottom:1px solid #16213a; padding:9px 10px; color:#e2e8f0; }
  table.data tr:hover td { background:#0d1526; }
  .rowlink { cursor:pointer; }
  .tag { font-size:11px; padding:2px 8px; border-radius:999px; font-weight:700; }
  .tag.grp { background:#1e3a8a; color:#bfdbfe; } .tag.ko { background:#78350f; color:#fed7aa; }
  .win { color:#4ade80; font-weight:800; } .los { color:#94a3b8; }

  /* Light cards (sumula/scoreboard/bracket) */
  .card { background:#fff; color:#0f172a; border-radius:12px; overflow:hidden; margin-bottom:18px; box-shadow:0 10px 30px rgba(0,0,0,.3); }
  .sum-head { text-align:center; padding:16px; }
  .sum-title { font-size:18px; font-weight:900; text-transform:uppercase; }
  table.sum { width:100%; border-collapse:collapse; }
  table.sum th, table.sum td { border:1px solid #000; padding:9px; text-align:center; }
  .p-red { background:#dc2626; color:#fff; font-weight:900; }
  .p-blue { background:#2563eb; color:#fff; font-weight:900; }
  .p-name { font-size:15px; } .p-club { font-size:12px; opacity:.95; }
  .sc-red { color:#dc2626; font-weight:900; font-size:20px; }
  .sc-blue { color:#2563eb; font-weight:900; font-size:20px; }
  .final td { background:#e2e8f0; font-weight:900; font-size:24px; }
  .winner { text-align:center; margin-top:14px; padding:12px; border:3px solid #000; border-radius:8px; background:#f1f5f9; font-weight:900; text-transform:uppercase; color:#000; }
  .bk { display:flex; gap:36px; overflow-x:auto; padding:18px; }
  .bk-col { display:flex; flex-direction:column; justify-content:space-around; gap:18px; min-width:200px; }
  .bk-col h4 { color:#64748b; font-size:11px; letter-spacing:1px; text-transform:uppercase; text-align:center; margin-bottom:6px; }
  .bk-match { background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; overflow:hidden; }
  .bk-row { display:flex; justify-content:space-between; padding:8px 12px; font-size:13px; border-bottom:1px solid #eef2f7; }
  .bk-row.w { background:#f0fdf4; font-weight:800; }
  .sb { background:#0b1220; color:#fff; border-radius:12px; padding:22px; }
  .sb-match { display:flex; align-items:center; justify-content:space-between; padding:13px 8px; border-bottom:1px solid #1e293b; }
  .sb-side { display:flex; align-items:center; gap:10px; font-size:15px; }
  .dot-r { width:12px; height:12px; border-radius:50%; background:#ef4444; }
  .dot-b { width:12px; height:12px; border-radius:50%; background:#3b82f6; }
  .sb-score { font-size:22px; font-weight:900; }
  .report { background:#fff; color:#0f172a; border-radius:12px; padding:26px; box-shadow:0 10px 30px rgba(0,0,0,.3); }
  .report h3 { text-align:center; text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
  .report .rsub { text-align:center; color:#475569; font-size:12px; margin-bottom:18px; }
  table.rank { width:100%; border-collapse:collapse; }
  table.rank th { background:#0f172a; color:#fff; padding:9px; font-size:12px; text-transform:uppercase; }
  table.rank td { border-bottom:1px solid #e2e8f0; padding:9px; text-align:center; font-size:13px; }
  table.rank td.name { text-align:left; font-weight:700; }
  .medal1 { background:#fef9c3; } .medal2 { background:#f1f5f9; } .medal3 { background:#ffedd5; }

  footer { text-align:center; color:#64748b; font-size:12px; padding:20px; border-top:1px solid #1e293b; }
  footer a { color:#60a5fa; }
  @media (max-width:720px){ aside{ width:100%; display:flex; overflow-x:auto; gap:4px; } aside .side-title{display:none;} .shell{flex-direction:column;} aside button{width:auto;white-space:nowrap;} }
</style>
</head>

const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function go(v, ctx){ VIEW=v; if(ctx) CTX={...CTX,...ctx}; render(); }

// SIDEBAR
function paintSide(){
  const m = T().menu;
  const items = [['home',m.home],['comps',m.comps],['athletes',m.athletes],['clubs',m.clubs],['classes',m.classes],['officials',m.officials],['reports',m.reports]];
  const activeTop = (VIEW==='home')?'home':(VIEW==='reports')?'reports':(['comps','comp','games','sheet','board'].includes(VIEW))?'comps':'';
  document.getElementById('side').innerHTML =
    `<div class="side-title">${esc(T().menu.home)}</div>` +
    items.map(([k,l])=>`<button data-nav="${k}" class="${k===activeTop?'active':''}">${esc(l)}</button>`).join('');
  document.querySelectorAll('#side button').forEach(b=> b.onclick = ()=>{
    const k=b.dataset.nav;
    if(k==='comps') go('comps');
    else if(k==='reports') go('reports');
    else if(k==='home') go('home');
    else go('comps'); // athletes/clubs/classes/officials -> demo routes to competitions list
  });
  document.getElementById('role').textContent = T().role;
  document.getElementById('badge').textContent = T().badge;
  document.getElementById('aviso').textContent = T().aviso;
  document.getElementById('footer').innerHTML = `${esc(T().footer)}<br>${esc(T().contact)} <a href="mailto:${EMAIL}">${EMAIL}</a> - Gabriel Sousa.`;
}
function crumb(parts){
  return `<div class="crumb">` + parts.map((p,i)=>{
    const sep = i? ' / ' : '';
    return sep + (p.go? `<span class="lnk" data-go="${p.go}">${esc(p.t)}</span>` : `<b>${esc(p.t)}</b>`);
  }).join('') + `</div>`;
}
function bindCrumb(){ document.querySelectorAll('.crumb .lnk').forEach(x=> x.onclick=()=>go(x.dataset.go)); }

// VIEWS
function vHome(){
  const L=T();

  app.innerHTML = `${crumb([{t:L.dash}])}
    <h2 class="page">${esc(L.dash)}</h2><p class="sub">${esc(L.dashSub)}</p>
    <div class="grid">
      ${tile(KPI.comps, L.kpiComps, 'comps')}
      ${tile(KPI.athletes, L.kpiAthletes, 'comps')}
      ${tile(KPI.clubs, L.kpiClubs, 'comps')}

      ${tile(KPI.officials, L.kpiOfficials, 'comps')}
      ${tile(KPI.feds, L.kpiFeds, 'comps')}
    </div>`;
  document.querySelectorAll('.tile').forEach(t=> t.onclick=()=>go(t.dataset.route));
}

    <td><span class="tag ${c.status==='live'?'grp':'ko'}">${c.status==='live'?esc(L.statusLive):esc(L.statusDone)}</span></td></tr>`).join('');
  app.innerHTML = `${crumb([{t:L.dash,go:'home'},{t:L.compList}])}
    <h2 class="page">${esc(L.compList)}</h2><p class="sub">${esc(L.compListSub)}</p>
    <div class="panel"><table class="data"><thead><tr>
      <th>${esc(L.thComp)}</th><th>${esc(L.thDate)}</th><th>${esc(L.thClasses)}</th><th>${esc(L.thStatus)}</th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
  bindCrumb();
  document.querySelectorAll('.rowlink').forEach(r=> r.onclick=()=>go('comp',{comp:COMPS.find(c=>c.id===r.dataset.id)}));
}
function vComp(){
  const L=T(), c=CTX.comp||COMPS[0];
  const chips = c.classes.map((cl,i)=>`<span class="chip ${i===0?'active':''}" data-cls="${esc(cl)}">${esc(cl)}</span>`).join('');
  const sched = SCHED.map(s=>`<tr><td>${esc(s.time)}</td><td>${s.court}</td><td>${esc(s.match)}</td></tr>`).join('');
  app.innerHTML = `${crumb([{t:L.dash,go:'home'},{t:L.compList,go:'comps'},{t:c.nome}])}
    <h2 class="page">${esc(c.nome)}</h2><p class="sub">${esc(L.compOverview)}</p>
    <div class="panel"><h3>${esc(L.general)}</h3>
      <div class="kv">
        <div><div class="lbl">${esc(L.location)}</div><div class="val">${esc(c.cidade)}</div></div>
        <div><div class="lbl">${esc(L.dates)}</div><div class="val">${esc(c.data)}</div></div>
        <div><div class="lbl">${esc(L.level)}</div><div class="val">${esc(L.natl)}</div></div>
        <div><div class="lbl">${esc(L.thClasses)}</div><div class="val">${c.classes.length}</div></div>
      </div></div>
    <div class="panel"><h3>${esc(L.classesTitle)}</h3>
      <div class="chips">${chips}</div>
      <p class="sub" style="margin:12px 0 0;">${esc(L.pickClass)}</p>
      <div class="btnrow"><button class="btn" id="toGames">${esc(L.goGames)} &rarr;</button></div>
    </div>
    <div class="panel"><h3>${esc(L.schedule)}</h3>
      <table class="data"><thead><tr><th>${esc(L.thTime)}</th><th>${esc(L.thCourt)}</th><th>${esc(L.thMatch)}</th></tr></thead>
      <tbody>${sched}</tbody></table></div>`;
  bindCrumb();
  document.querySelectorAll('.chip').forEach(ch=> ch.onclick=()=>{ document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active')); ch.classList.add('active'); CTX.cls=ch.dataset.cls; });
  document.getElementById('toGames').onclick=()=>go('games',{cls: CTX.cls || c.classes[0]});
}
function vGames(){
  const L=T(), c=CTX.comp||COMPS[0], cls=CTX.cls||c.classes[0];
  const grows = GROUP.map(g=>`<tr>
    <td>${g.pos}</td><td class="name" style="text-align:left">${esc(g.nome)}</td>
    <td>${g.p}</td><td class="win">${g.w}</td><td class="los">${g.l}</td><td><b>${g.pts}</b></td><td>${esc(g.diff)}</td></tr>`).join('');
  const col=(titulo,jogos)=>`<div class="bk-col"><h4>${esc(titulo)}</h4>${jogos.map(j=>`
    <div class="bk-match"><div class="bk-row ${(+j[2]>+j[3])?'w':''}"><span>${esc(j[0])}</span><b>${esc(j[2])}</b></div>
    <div class="bk-row ${(+j[3]>+j[2])?'w':''}"><span>${esc(j[1])}</span><b>${esc(j[3])}</b></div></div>`).join('')}</div>`;
  app.innerHTML = `${crumb([{t:L.dash,go:'home'},{t:L.compList,go:'comps'},{t:c.nome,go:'comp'},{t:L.gamesTitle+' - '+cls}])}
    <h2 class="page">${esc(L.gamesTitle)} <span style="color:#60a5fa">${esc(cls)}</span></h2>
    <div class="panel"><h3>${esc(L.method)}</h3><p class="sub" style="margin:0">${esc(L.methodTxt)}</p></div>
    <div class="panel"><h3>${esc(L.groups)} - ${esc(L.standings)}</h3>
      <table class="data"><thead><tr>
        <th>${esc(L.thPos)}</th><th>${esc(L.thTeam)}</th><th>${esc(L.thP)}</th><th>${esc(L.thW)}</th><th>${esc(L.thL)}</th><th>${esc(L.thPts)}</th><th>${esc(L.thDiff)}</th>
      </tr></thead><tbody>${grows}</tbody></table>
      <div class="btnrow"><button class="btn" id="bSheet">${esc(L.viewSheet)}</button><button class="btn ghost" id="bBoard">${esc(L.viewBoard)}</button></div>
    </div>
    <div class="panel"><h3>${esc(L.knockout)}</h3>
      <div class="card" style="margin:0"><div class="bk">${col(L.qf,chave.QF)}${col(L.sf,chave.SF)}${col(L.fin,chave.FIN)}</div></div>
    </div>`;
  bindCrumb();
  document.getElementById('bSheet').onclick=()=>go('sheet');
  document.getElementById('bBoard').onclick=()=>go('board');
}
function vSheet(){
  const L=T(), P=partida, c=CTX.comp||COMPS[0];
  const t1=P.parciais.reduce((s,p)=>s+p.p1,0), t2=P.parciais.reduce((s,p)=>s+p.p2,0);
  const rows=P.parciais.map((p,i)=>`<tr><td>${p.t1}</td><td class="sc-red">${p.p1}</td>
    <td style="background:#f8fafc;font-weight:800;">P${i+1}</td><td class="sc-blue">${p.p2}</td><td>${p.t2}</td></tr>`).join('');
  const w=t1>t2?P.p1:P.p2;
  app.innerHTML = `${crumb([{t:L.dash,go:'home'},{t:c.nome,go:'comp'},{t:L.gamesTitle,go:'games'},{t:L.viewSheet}])}
    <div class="card">
    <div class="sum-head"><div class="sum-title">${esc(L.title)} - ${esc(c.nome)}</div></div>
    <table class="sum"><thead>
      <tr><th colspan="2" class="p-red"><div class="p-name">${esc(P.p1.bib+' - '+P.p1.nome)}</div><div class="p-club">${esc(P.p1.clube)}</div></th>
      <th style="background:#0f172a;color:#fff;">${esc(L.vs)}</th>
      <th colspan="2" class="p-blue"><div class="p-name">${esc(P.p2.bib+' - '+P.p2.nome)}</div><div class="p-club">${esc(P.p2.clube)}</div></th></tr>
      <tr style="background:#f1f5f9;"><th>${esc(L.timeV)}</th><th>${esc(L.pts)}</th><th>${esc(L.partial)}</th><th>${esc(L.pts)}</th><th>${esc(L.timeA)}</th></tr>
      </thead><tbody>${rows}</tbody>
      <tfoot><tr class="final"><td colspan="2" class="sc-red">${t1}</td><td>${esc(L.finalScore)}</td><td colspan="2" class="sc-blue">${t2}</td></tr></tfoot></table>
    <div style="padding:0 18px 18px;"><div class="winner">${esc(L.winner)}: ${esc(w.bib+' - '+w.nome)} (${esc(w.clube)})</div></div>
    </div>`;
  bindCrumb();
}
function vBoard(){
  const L=T(), c=CTX.comp||COMPS[0];
  app.innerHTML = `${crumb([{t:L.dash,go:'home'},{t:c.nome,go:'comp'},{t:L.gamesTitle,go:'games'},{t:L.viewBoard}])}
    <div class="sb"><h2 style="margin-bottom:14px;">${esc(L.live)}</h2>
    ${scoreboard.map(m=>`<div class="sb-match">
      <div class="sb-side"><span class="dot-r"></span>${esc(m.r)}</div>
      <div class="sb-score">${m.sr} <span style="color:#475569;">x</span> ${m.sb}</div>
      <div class="sb-side">${esc(m.b)}<span class="dot-b"></span></div>
      <div style="color:#94a3b8;font-size:12px;min-width:90px;text-align:right;">${esc(L.court)} ${m.court}</div></div>`).join('')}
    </div>`;
  bindCrumb();
}
function vReports(){
  const L=T();
  const tile=(l,route)=>`<div class="tile" data-r="${route}"><div class="l" style="font-size:14px;color:#fff;font-weight:700">${esc(l)}</div><div class="go">${esc(L.open)} &rarr;</div></div>`;
  app.innerHTML = `${crumb([{t:L.dash,go:'home'},{t:L.reportsTitle}])}
    <h2 class="page">${esc(L.reportsTitle)}</h2><p class="sub">${esc(L.reportsSub)}</p>
    <div class="grid">
      ${tile(L.rFinal,'rank')}${tile(L.rSheet,'sheet')}${tile(L.rDT,'dt')}
    </div>`;
  bindCrumb();
  document.querySelectorAll('.tile').forEach(t=> t.onclick=()=>{ const r=t.dataset.r; if(r==='sheet') go('sheet'); else if(r==='rank') go('rank'); else go('dt'); });
}
function vRank(){
  const L=T(), c=CTX.comp||COMPS[0];
  const rows=RANKING.map(r=>`<tr class="${r.pos===1?'medal1':r.pos===2?'medal2':r.pos===3?'medal3':''}">
    <td><b>${r.pos}</b></td><td class="name">${esc(r.nome)}</td><td>${esc(r.clube)}</td></tr>`).join('');
  app.innerHTML = `${crumb([{t:L.dash,go:'home'},{t:L.reportsTitle,go:'reports'},{t:L.rFinal}])}
    <div class="report"><h3>${esc(L.finalRank)}</h3><div class="rsub">${esc(c.nome)} - ${esc(L.generated)}</div>
    <table class="rank"><thead><tr><th>${esc(L.thPos)}</th><th style="text-align:left">${esc(L.thTeam)}</th><th>${esc(L.kpiClubs)}</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
  bindCrumb();
}
function vDT(){
  const L=T(), c=CTX.comp||COMPS[0];
  app.innerHTML = `${crumb([{t:L.dash,go:'home'},{t:L.reportsTitle,go:'reports'},{t:L.rDT}])}
    <div class="report"><h3>${esc(L.dtReport)}</h3><div class="rsub">${esc(c.nome)} - ${esc(L.generated)}</div>
    <ul style="line-height:1.9;font-size:14px;padding-left:20px;">
      <li>${esc(L.dtLine1)}</li><li>${esc(L.dtLine2)}</li><li>${esc(L.dtLine3)}</li><li>${esc(L.dtLine4)}</li>
    </ul></div>`;
  bindCrumb();
}

const VIEWS = { home:vHome, comps:vComps, comp:vComp, games:vGames, sheet:vSheet, board:vBoard, reports:vReports, rank:vRank, dt:vDT };
function render(){ paintSide(); (VIEWS[VIEW]||vHome)(); }

document.querySelectorAll('.lang button').forEach(b=> b.onclick=()=>{
  LANG=b.dataset.lang; document.documentElement.lang=LANG;
  document.querySelectorAll('.lang button').forEach(x=>x.classList.toggle('active', x===b));
  render();
});
render();
</script>
</body>
</html>
