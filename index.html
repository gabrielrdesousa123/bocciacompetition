<!--
  ============================================================================
  SCBP - PUBLIC DEMO / DEMOSTRACION / DEMONSTRACAO (standalone)
  ----------------------------------------------------------------------------
  Navigation mirrors the real system flow (Home > Load competition >
  Competition dashboard > tabs > games/method > live sheet/scoreboard > reports).
  Runs 100% in the browser with FICTIONAL data. No backend, no login, no keys,
  no commercial logic (draw engine, World Boccia/BCMS, official ranking).
  Full proprietary system: see README. Contact: gabrielrdesousa@gmail.com
  ============================================================================
-->

<title>SCBP - Boccia Competition System - Demo</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family: system-ui,-apple-system,sans-serif; background:#f8fafc; color:#0f172a; }
  a { text-decoration:none; color:inherit; }
  .topbar { background:#0f172a; color:#fff; padding:12px 22px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
  .topbar .brand { font-size:16px; font-weight:800; }
  .topbar .role { font-size:11px; background:#1e3a8a; color:#bfdbfe; padding:3px 9px; border-radius:999px; font-weight:700; margin-left:8px; }
  .lang { display:flex; gap:4px; }
  .lang button { background:#1e293b; color:#cbd5e1; border:none; padding:5px 10px; border-radius:6px; font-size:11px; font-weight:700; cursor:pointer; }
  .lang button.active { background:#2563eb; color:#fff; }
  .badge { font-size:11px; background:#1e293b; color:#94a3b8; padding:4px 10px; border-radius:999px; }
  .aviso { background:#fff7ed; color:#9a3412; border-bottom:1px solid #fed7aa; font-size:12px; padding:8px 22px; text-align:center; }

  .wrap { max-width:1200px; margin:0 auto; padding:28px 20px; }
  .crumb { font-size:13px; color:#64748b; margin-bottom:18px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .crumb b { color:#0f172a; } .crumb .lnk { color:#2563eb; cursor:pointer; }
  .pgtitle { font-size:30px; font-weight:900; letter-spacing:-.5px; color:#0f172a; }
  .pgsub { font-size:15px; color:#64748b; margin-top:5px; margin-bottom:6px; }
  .sec { font-size:16px; font-weight:800; text-transform:uppercase; letter-spacing:1px; border-left:5px solid #0f172a; padding-left:14px; margin:38px 0 16px; }
  .sec.blue { border-left-color:#3b82f6; color:#1d4ed8; }
  .sec.red { border-left-color:#ef4444; color:#b91c1c; }
  .sec.green { border-left-color:#10b981; color:#15803d; }
  .sec.amber { border-left-color:#f59e0b; color:#b45309; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:18px; }
  .card { background:#fff; border:1px solid #cbd5e1; border-radius:10px; padding:22px 20px; display:flex; gap:15px; align-items:flex-start; cursor:pointer; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .card:hover { transform:translateY(-3px); box-shadow:0 10px 20px rgba(0,0,0,.1); border-color:#94a3b8; }
  .card .ic { font-size:22px; font-weight:900; width:54px; height:54px; display:flex; align-items:center; justify-content:center; border-radius:12px; flex-shrink:0; background:#f1f5f9; color:#334155; }
  .theme-blue .ic{background:#eff6ff;color:#2563eb;} .theme-red .ic{background:#fef2f2;color:#ef4444;}
  .theme-green .ic{background:#f0fdf4;color:#16a34a;} .theme-amber .ic{background:#fffbeb;color:#d97706;}
  .card .lbl { font-size:16px; font-weight:800; margin-bottom:5px; }
  .card .desc { font-size:13px; color:#64748b; line-height:1.4; }

  .panel { background:#fff; border:1px solid #e2e8f0; border-radius:10px; padding:18px; margin-bottom:18px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .panel h3 { font-size:14px; text-transform:uppercase; letter-spacing:.5px; color:#0f172a; margin-bottom:12px; }
  .kv { display:flex; flex-wrap:wrap; gap:12px 30px; }
  .kv .lbl { color:#94a3b8; font-size:11px; text-transform:uppercase; }
  .kv .val { font-weight:800; font-size:14px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { background:#f1f5f9; color:#334155; padding:7px 14px; border-radius:999px; font-size:13px; font-weight:700; cursor:pointer; border:1px solid #e2e8f0; }
  .chip.active { background:#2563eb; color:#fff; border-color:#2563eb; }
  .btn { background:#2563eb; color:#fff; border:none; padding:10px 18px; border-radius:8px; font-weight:800; font-size:13px; cursor:pointer; }
  .btn.ghost { background:#f1f5f9; color:#334155; }
  .btnrow { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }

  /* competition dashboard tabs (mirrors real tabs) */
  .tabs { display:flex; flex-wrap:wrap; gap:10px; }
  .tab { background:#fff; border:1px solid #cbd5e1; border-radius:10px; padding:16px; cursor:pointer; transition:.15s; display:flex; gap:12px; align-items:center; }
  .tab:hover { border-color:#2563eb; box-shadow:0 6px 14px rgba(0,0,0,.08); }
  .tab .ti { width:42px; height:42px; border-radius:10px; background:#eff6ff; color:#2563eb; display:flex; align-items:center; justify-content:center; font-weight:900; flex-shrink:0; }
  .tab .tl { font-size:14px; font-weight:800; } .tab .td { font-size:12px; color:#64748b; }
  .tabgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }

  table.data { width:100%; border-collapse:collapse; font-size:13px; }
  table.data th { text-align:left; color:#64748b; font-size:11px; text-transform:uppercase; border-bottom:2px solid #e2e8f0; padding:9px 10px; }
  table.data td { border-bottom:1px solid #eef2f7; padding:10px; }
  table.data tr.rowlink { cursor:pointer; } table.data tr.rowlink:hover td { background:#f8fafc; }
  .tag { font-size:11px; padding:2px 9px; border-radius:999px; font-weight:800; }
  .tag.live { background:#dcfce7; color:#15803d; } .tag.done { background:#f1f5f9; color:#475569; }
  .win { color:#15803d; font-weight:800; } .los { color:#94a3b8; }

  /* light game cards */
  .lightcard { background:#fff; border:1px solid #e2e8f0; border-radius:10px; overflow:hidden; margin-bottom:18px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .sum-head { text-align:center; padding:16px; }
  .sum-title { font-size:18px; font-weight:900; text-transform:uppercase; }
  table.sum { width:100%; border-collapse:collapse; }
  table.sum th, table.sum td { border:1px solid #0f172a; padding:9px; text-align:center; }
  .p-red { background:#dc2626; color:#fff; font-weight:900; } .p-blue { background:#2563eb; color:#fff; font-weight:900; }
  .p-name { font-size:15px; } .p-club { font-size:12px; opacity:.95; }
  .sc-red { color:#dc2626; font-weight:900; font-size:20px; } .sc-blue { color:#2563eb; font-weight:900; font-size:20px; }
  .final td { background:#e2e8f0; font-weight:900; font-size:24px; }
  .winner { text-align:center; margin:14px 18px 18px; padding:12px; border:3px solid #0f172a; border-radius:8px; background:#f1f5f9; font-weight:900; text-transform:uppercase; }
  .bk { display:flex; gap:36px; overflow-x:auto; padding:18px; }
  .bk-col { display:flex; flex-direction:column; justify-content:space-around; gap:18px; min-width:200px; }
  .bk-col h4 { color:#64748b; font-size:11px; letter-spacing:1px; text-transform:uppercase; text-align:center; margin-bottom:6px; }
  .bk-match { background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; overflow:hidden; }
  .bk-row { display:flex; justify-content:space-between; padding:8px 12px; font-size:13px; border-bottom:1px solid #eef2f7; }
  .bk-row.w { background:#f0fdf4; font-weight:800; }
  .sb { background:#0b1220; color:#fff; border-radius:10px; padding:22px; }
  .sb-match { display:flex; align-items:center; justify-content:space-between; padding:13px 8px; border-bottom:1px solid #1e293b; }
  .sb-side { display:flex; align-items:center; gap:10px; font-size:15px; }
  .dot-r{width:12px;height:12px;border-radius:50%;background:#ef4444;} .dot-b{width:12px;height:12px;border-radius:50%;background:#3b82f6;}
  .sb-score { font-size:22px; font-weight:900; }
  .report { background:#fff; border:1px solid #e2e8f0; border-radius:10px; padding:26px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .report h3 { text-align:center; text-transform:uppercase; letter-spacing:1px; }
  .report .rsub { text-align:center; color:#64748b; font-size:12px; margin-bottom:18px; }
  table.rank { width:100%; border-collapse:collapse; }
  table.rank th { background:#0f172a; color:#fff; padding:9px; font-size:12px; text-transform:uppercase; }
  table.rank td { border-bottom:1px solid #e2e8f0; padding:9px; text-align:center; font-size:13px; }
  table.rank td.name { text-align:left; font-weight:700; }
  .m1{background:#fef9c3;} .m2{background:#f1f5f9;} .m3{background:#ffedd5;}

  footer { text-align:center; color:#64748b; font-size:12px; padding:22px; border-top:1px solid #e2e8f0; margin-top:20px; }
  footer a { color:#2563eb; }

  parciais:[{p1:1,p2:0,t1:'00:14',t2:'01:48'},{p1:1,p2:0,t1:'00:06',t2:'00:00'},{p1:3,p2:0,t1:'00:56',t2:'02:39'},{p1:1,p2:0,t1:'00:00',t2:'01:37'}] };
const chave={ QF:[['1105 - ALPHA','1104 - DELTA','10','1'],['1102 - BETA','1108 - GAMMA','6','2']], SF:[['WINNER QF1','WINNER QF2','-','-']], FIN:[['WINNER SF1','WINNER SF2','-','-']] };
const scoreboard=[{r:'2401 - ALPHA',b:'2404 - DELTA',sr:4,sb:2,court:1},{r:'2402 - BETA',b:'2408 - GAMMA',sr:1,sb:6,court:2},{r:'2405 - OMEGA',b:'2406 - SIGMA',sr:3,sb:3,court:3}];
const RANKING=[{pos:1,nome:'1105 - RED DEMO',clube:'ALPHA CLUB'},{pos:2,nome:'1102 - BLUE DEMO',clube:'BETA CLUB'},{pos:3,nome:'1108 - GREEN DEMO',clube:'GAMMA CLUB'},{pos:4,nome:'1104 - GREY DEMO',clube:'DELTA CLUB'},{pos:5,nome:'1107 - AMBER DEMO',clube:'OMEGA CLUB'}];

let LANG='en', VIEW='home', CTX={};
const app=document.getElementById('app');
const T=()=>I18N[LANG];
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function go(v,ctx){ VIEW=v; if(ctx) CTX={...CTX,...ctx}; window.scrollTo(0,0); render(); }
function chrome(){ document.getElementById('role').textContent=T().role; document.getElementById('badge').textContent=T().badge; document.getElementById('aviso').textContent=T().aviso;
  document.getElementById('footer').innerHTML=`${esc(T().footer)}<br>${esc(T().contact)} <a href="mailto:${EMAIL}">${EMAIL}</a> - Gabriel Sousa.`; }
function crumb(parts){ return `<div class="crumb">`+parts.map((p,i)=>{const s=i?' / ':''; return s+(p.go?`<span class="lnk" data-go="${p.go}">${esc(p.t)}</span>`:`<b>${esc(p.t)}</b>`);}).join('')+`</div>`; }
function bindCrumb(){ document.querySelectorAll('.crumb .lnk').forEach(x=>x.onclick=()=>go(x.dataset.go)); }
function card(theme,ic,lbl,desc,route){ return `<div class="card theme-${theme}" data-route="${route}"><div class="ic">${ic}</div><div><div class="lbl">${esc(lbl)}</div><div class="desc">${esc(desc)}</div></div></div>`; }

// HOME (national admin) - mirrors dashboard.js sections
function vHome(){
  const L=T();
  app.innerHTML=`${crumb([{t:L.home}])}
    <div class="pgtitle">${esc(L.homeTitle)}</div><div class="pgsub">${esc(L.homeSub)}</div>
    <div class="sec blue">${esc(L.secUser)}</div>
    <div class="grid">
      ${card('blue','MD',L.cMyData,L.dMyData,'home')}
      ${card('blue','CP',L.cComps,L.dComps,'load')}
      ${card('blue','HI',L.cHistory,L.dHistory,'home')}
    </div>
    <div class="sec red">${esc(L.secComp)}</div>
    <div class="grid">${card('red','GC',L.cManage,L.dManage,'load')}</div>
    <div class="sec green">${esc(L.secData)}</div>
    <div class="grid">
      ${card('green','AT',L.cAthletes,L.dAthletes,'load')}
      ${card('green','CL',L.cClubs,L.dClubs,'load')}
      ${card('green','OF',L.cOfficials,L.dOfficials,'load')}
      ${card('green','CS',L.cClasses,L.dClasses,'load')}
    </div>
    <div class="sec amber">${esc(L.secSys)}</div>
    <div class="grid">
      ${card('amber','US',L.cUsers,L.dUsers,'load')}
      ${card('amber','FC',L.cFuncCls,L.dFuncCls,'load')}
      ${card('amber','ST',L.cStatus,L.dStatus,'load')}
      ${card('amber','RP',L.cReports,L.dReports,'reports')}
    </div>`;
  document.querySelectorAll('.card').forEach(c=>c.onclick=()=>go(c.dataset.route));
}
// LOAD COMPETITION
function vLoad(){
  const L=T();
  const rows=COMPS.map(c=>`<tr class="rowlink" data-id="${c.id}">
    <td><b>${esc(c.nome)}</b></td><td>${esc(c.data)}</td><td>${c.classes.length}</td>
    <td><span class="tag ${c.status==='live'?'live':'done'}">${c.status==='live'?esc(L.stLive):esc(L.stDone)}</span></td></tr>`).join('');
  app.innerHTML=`${crumb([{t:L.home,go:'home'},{t:L.loadTitle}])}
    <div class="pgtitle">${esc(L.loadTitle)}</div><div class="pgsub">${esc(L.loadSub)}</div>
    <div class="panel"><table class="data"><thead><tr>
      <th>${esc(L.thComp)}</th><th>${esc(L.thDate)}</th><th>${esc(L.thClasses)}</th><th>${esc(L.thStatus)}</th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
  bindCrumb();
  document.querySelectorAll('.rowlink').forEach(r=>r.onclick=()=>go('comp',{comp:COMPS.find(c=>c.id===r.dataset.id)}));
}
// COMPETITION DASHBOARD - real tabs
function vComp(){
  const L=T(), c=CTX.comp||COMPS[0];
  const tabs=[
    ['AT',L.tAthletes,L.tAthletesD,'comp'],['CL',L.tClubs,L.tClubsD,'comp'],['OF',L.tOfficials,L.tOfficialsD,'comp'],
    ['AG',L.tSchedule,L.tScheduleD,'comp'],['SO',L.tDraw,L.tDrawD,'games'],['JG',L.tGames,L.tGamesD,'games'],
    ['RS',L.tResults,L.tResultsD,'games'],['SU',L.tSheets,L.tSheetsD,'sheet'],['CC',L.tCallRoom,L.tCallRoomD,'board'],
    ['SB',L.tScoreboard,L.tScoreboardD,'board'],['DT',L.tDT,L.tDTD,'dt'],['BC',L.tSync,L.tSyncD,'comp'],
  ];
  const chips=c.classes.map((cl,i)=>`<span class="chip ${i===0?'active':''}" data-cls="${esc(cl)}">${esc(cl)}</span>`).join('');
  app.innerHTML=`${crumb([{t:L.home,go:'home'},{t:L.loadTitle,go:'load'},{t:c.nome}])}
    <div class="pgtitle">${esc(c.nome)}</div><div class="pgsub">${esc(L.compDash)}</div>
    <div class="panel"><h3>${esc(L.general)}</h3>
      <div class="kv">
        <div><div class="lbl">${esc(L.location)}</div><div class="val">${esc(c.cidade)}</div></div>
        <div><div class="lbl">${esc(L.dates)}</div><div class="val">${esc(c.data)}</div></div>
        <div><div class="lbl">${esc(L.level)}</div><div class="val">${esc(L.natl)}</div></div>
      </div>
      <div style="margin-top:14px"><div class="lbl" style="color:#94a3b8;font-size:11px;text-transform:uppercase;margin-bottom:8px">${esc(L.classesTitle)}</div><div class="chips">${chips}</div></div>
    </div>
    <div class="sec blue">${esc(L.compDash)}</div><div class="pgsub" style="margin-top:-6px">${esc(L.pickTab)}</div>
    <div class="tabgrid">${tabs.map(([ic,l,d,r])=>`<div class="tab" data-r="${r}"><div class="ti">${ic}</div><div><div class="tl">${esc(l)}</div><div class="td">${esc(d)}</div></div></div>`).join('')}</div>`;
  bindCrumb();
  document.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));ch.classList.add('active');CTX.cls=ch.dataset.cls;});
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>go(t.dataset.r,{cls:CTX.cls||c.classes[0]}));
}
// GAMES TABLE
function vGames(){
  const L=T(), c=CTX.comp||COMPS[0], cls=CTX.cls||c.classes[0];
  const grows=GROUP.map(g=>`<tr><td>${g.pos}</td><td style="text-align:left"><b>${esc(g.nome)}</b></td><td>${g.p}</td><td class="win">${g.w}</td><td class="los">${g.l}</td><td><b>${g.pts}</b></td><td>${esc(g.diff)}</td></tr>`).join('');
  const col=(titulo,jogos)=>`<div class="bk-col"><h4>${esc(titulo)}</h4>${jogos.map(j=>`<div class="bk-match"><div class="bk-row ${(+j[2]>+j[3])?'w':''}"><span>${esc(j[0])}</span><b>${esc(j[2])}</b></div><div class="bk-row ${(+j[3]>+j[2])?'w':''}"><span>${esc(j[1])}</span><b>${esc(j[3])}</b></div></div>`).join('')}</div>`;
  app.innerHTML=`${crumb([{t:L.home,go:'home'},{t:L.loadTitle,go:'load'},{t:c.nome,go:'comp'},{t:L.tGames+' - '+cls}])}
    <div class="pgtitle">${esc(L.gamesTitle)} <span style="color:#2563eb">${esc(cls)}</span></div>
    <div class="panel" style="margin-top:14px"><h3>${esc(L.method)}</h3><div class="pgsub" style="margin:0">${esc(L.methodTxt)}</div></div>
    <div class="panel"><h3>${esc(L.groups)}</h3>
      <table class="data"><thead><tr><th>${esc(L.thPos)}</th><th>${esc(L.thTeam)}</th><th>${esc(L.thP)}</th><th>${esc(L.thW)}</th><th>${esc(L.thL)}</th><th>${esc(L.thPts)}</th><th>${esc(L.thDiff)}</th></tr></thead><tbody>${grows}</tbody></table>
      <div class="btnrow"><button class="btn" id="bSheet">${esc(L.viewSheet)}</button><button class="btn ghost" id="bBoard">${esc(L.viewBoard)}</button></div>
    </div>
    <div class="panel"><h3>${esc(L.knockout)}</h3><div class="lightcard" style="margin:0"><div class="bk">${col(L.qf,chave.QF)}${col(L.sf,chave.SF)}${col(L.fin,chave.FIN)}</div></div></div>`;
  bindCrumb();
  document.getElementById('bSheet').onclick=()=>go('sheet');
  document.getElementById('bBoard').onclick=()=>go('board');
}
function vSheet(){
  const L=T(), P=partida, c=CTX.comp||COMPS[0];
  const t1=P.parciais.reduce((s,p)=>s+p.p1,0), t2=P.parciais.reduce((s,p)=>s+p.p2,0);
  const rows=P.parciais.map((p,i)=>`<tr><td>${p.t1}</td><td class="sc-red">${p.p1}</td><td style="background:#f8fafc;font-weight:800;">P${i+1}</td><td class="sc-blue">${p.p2}</td><td>${p.t2}</td></tr>`).join('');
  const w=t1>t2?P.p1:P.p2;
  app.innerHTML=`${crumb([{t:L.home,go:'home'},{t:c.nome,go:'comp'},{t:L.tGames,go:'games'},{t:L.tSheets}])}
    <div class="lightcard"><div class="sum-head"><div class="sum-title">${esc(L.title)} - ${esc(c.nome)}</div></div>
    <table class="sum"><thead>
      <tr><th colspan="2" class="p-red"><div class="p-name">${esc(P.p1.bib+' - '+P.p1.nome)}</div><div class="p-club">${esc(P.p1.clube)}</div></th>
      <th style="background:#0f172a;color:#fff;">${esc(L.vs)}</th>
      <th colspan="2" class="p-blue"><div class="p-name">${esc(P.p2.bib+' - '+P.p2.nome)}</div><div class="p-club">${esc(P.p2.clube)}</div></th></tr>
      <tr style="background:#f1f5f9;"><th>${esc(L.timeV)}</th><th>${esc(L.pts)}</th><th>${esc(L.partial)}</th><th>${esc(L.pts)}</th><th>${esc(L.timeA)}</th></tr>
      </thead><tbody>${rows}</tbody>
      <tfoot><tr class="final"><td colspan="2" class="sc-red">${t1}</td><td>${esc(L.finalScore)}</td><td colspan="2" class="sc-blue">${t2}</td></tr></tfoot></table>
    <div class="winner">${esc(L.winner)}: ${esc(w.bib+' - '+w.nome)} (${esc(w.clube)})</div></div>`;
  bindCrumb();
}
function vBoard(){
  const L=T(), c=CTX.comp||COMPS[0];
  app.innerHTML=`${crumb([{t:L.home,go:'home'},{t:c.nome,go:'comp'},{t:L.tGames,go:'games'},{t:L.tScoreboard}])}
    <div class="sb"><h2 style="margin-bottom:14px;">${esc(L.live)}</h2>
    ${scoreboard.map(m=>`<div class="sb-match"><div class="sb-side"><span class="dot-r"></span>${esc(m.r)}</div><div class="sb-score">${m.sr} <span style="color:#475569;">x</span> ${m.sb}</div><div class="sb-side">${esc(m.b)}<span class="dot-b"></span></div><div style="color:#94a3b8;font-size:12px;min-width:90px;text-align:right;">${esc(L.court)} ${m.court}</div></div>`).join('')}
    </div>`;
  bindCrumb();
}
function vReports(){
  const L=T();
  app.innerHTML=`${crumb([{t:L.home,go:'home'},{t:L.reportsTitle}])}
    <div class="pgtitle">${esc(L.reportsTitle)}</div><div class="pgsub">${esc(L.reportsSub)}</div>
    <div class="grid" style="margin-top:14px">
      ${card('amber','1',L.rFinal,L.rFinalD,'rank')}
      ${card('amber','2',L.rSheet,L.rSheetD,'sheet')}
      ${card('amber','3',L.rDT,L.rDTD,'dt')}
    </div>`;
  document.querySelectorAll('.card').forEach(c=>c.onclick=()=>go(c.dataset.route));
  bindCrumb();
}
function vRank(){
  const L=T(), c=CTX.comp||COMPS[0];
  const rows=RANKING.map(r=>`<tr class="${r.pos===1?'m1':r.pos===2?'m2':r.pos===3?'m3':''}"><td><b>${r.pos}</b></td><td class="name">${esc(r.nome)}</td><td>${esc(r.clube)}</td></tr>`).join('');
  app.innerHTML=`${crumb([{t:L.home,go:'home'},{t:L.reportsTitle,go:'reports'},{t:L.rFinal}])}
    <div class="report"><h3>${esc(L.finalRank)}</h3><div class="rsub">${esc(c.nome)} - ${esc(L.generated)}</div>
    <table class="rank"><thead><tr><th>${esc(L.thPos)}</th><th style="text-align:left">${esc(L.thTeam)}</th><th>${esc(L.cClubs)}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  bindCrumb();
}
function vDT(){
  const L=T(), c=CTX.comp||COMPS[0];
  app.innerHTML=`${crumb([{t:L.home,go:'home'},{t:c.nome,go:'comp'},{t:L.tDT}])}
    <div class="report"><h3>${esc(L.dtReport)}</h3><div class="rsub">${esc(c.nome)} - ${esc(L.generated)}</div>
    <ul style="line-height:1.9;font-size:14px;padding-left:20px;"><li>${esc(L.dtLine1)}</li><li>${esc(L.dtLine2)}</li><li>${esc(L.dtLine3)}</li><li>${esc(L.dtLine4)}</li></ul></div>`;
  bindCrumb();
}
const VIEWS={ home:vHome, load:vLoad, comp:vComp, games:vGames, sheet:vSheet, board:vBoard, reports:vReports, rank:vRank, dt:vDT };
function render(){ chrome(); (VIEWS[VIEW]||vHome)(); }
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{ LANG=b.dataset.lang; document.documentElement.lang=LANG; document.querySelectorAll('.lang button').forEach(x=>x.classList.toggle('active',x===b)); render(); });
render();
</script>
